[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdgt-nta"
version = "0.2.0"
description = "Reproducible qDGT-NTA prediction and paper figure generation"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.24.4", "pandas==2.0.3", "openpyxl==3.1.2",
  "scipy==1.10.1", "scikit-learn==1.3.2", "xgboost-cpu==2.1.4",
  "rdkit==2023.9.6", "mordred==1.2.0", "joblib==1.3.2",
  "matplotlib==3.7.4", "networkx==2.8.8"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7", "nbclient>=0.10,<1"]

[project.scripts]
qdgt-nta = "qdgt_nta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
